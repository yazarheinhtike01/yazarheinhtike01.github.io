<!doctype html>
<html lang="my">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Japanese Monthly Salary Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Padauk:wght@400;700&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
      :root{
        --paper:#f3ecda;
        --paper-deep:#e9dfc6;
        --card:#fffdf4;
        --card-edge:#d9cdae;
        --ink:#22304f;
        --ink-soft:#5d6577;
        --ink-faint:#8b8fa0;
        --red:#bc3a24;
        --red-soft:#f6ddd3;
        --gold:#a97e22;
        --green:#3d6b4f;
        --line:#ddd2b8;
        --field:#fbf7ea;
        --tab-bg:#fdfaf0;
        --shadow:0 10px 30px rgba(34,48,79,.14);
        --serif:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
        --sans:"Zen Kaku Gothic New","Padauk","Hiragino Kaku Gothic ProN","Noto Sans Myanmar",sans-serif;
      }
      [data-theme="dark"]{
        --paper:#10151f;
        --paper-deep:#0b0f16;
        --card:#1c2434;
        --card-edge:#39445c;
        --ink:#ece4cf;
        --ink-soft:#a7adbc;
        --ink-faint:#7c8496;
        --red:#e0684c;
        --red-soft:#3d2a26;
        --gold:#d3a94e;
        --green:#7fb08f;
        --line:#333f57;
        --field:#232d42;
        --tab-bg:#171e2c;
        --shadow:0 10px 30px rgba(0,0,0,.5);
      }
      /* ---------- character themes (boy / girl) ---------- */
      [data-gender="boy"]{
        --paper:#eaf0f7;
        --paper-deep:#d7e1ee;
        --card:#fcfdff;
        --card-edge:#b3c3da;
        --ink:#1d2c4e;
        --ink-soft:#54637c;
        --ink-faint:#8494ac;
        --red:#2f5fb3;
        --red-soft:#d7e2f2;
        --gold:#b07d2b;
        --green:#2f6b57;
        --line:#c3cede;
        --field:#eef2f8;
        --tab-bg:#f4f7fb;
      }
      [data-theme="dark"][data-gender="boy"]{
        --paper:#0e1420;
        --paper-deep:#090d15;
        --card:#182233;
        --card-edge:#33445f;
        --ink:#dfe7f2;
        --ink-soft:#9fb0c6;
        --ink-faint:#71809a;
        --red:#7ba3e0;
        --red-soft:#26344c;
        --gold:#d3a94e;
        --green:#7fb08f;
        --line:#2e3c56;
        --field:#1e2a40;
        --tab-bg:#131b2b;
      }
      [data-gender="girl"]{
        --paper:#faeeee;
        --paper-deep:#efd8d8;
        --card:#fffafa;
        --card-edge:#dfb9b9;
        --ink:#4a2436;
        --ink-soft:#7d5a68;
        --ink-faint:#a58592;
        --red:#c2436e;
        --red-soft:#f7dbe4;
        --gold:#b07d2b;
        --green:#3d6b4f;
        --line:#ecd0d0;
        --field:#fdf3f1;
        --tab-bg:#fdf6f4;
      }
      [data-theme="dark"][data-gender="girl"]{
        --paper:#1c1116;
        --paper-deep:#140b0f;
        --card:#2a1a21;
        --card-edge:#553a46;
        --ink:#f2e2e8;
        --ink-soft:#c2a3ae;
        --ink-faint:#8f7280;
        --red:#e58bab;
        --red-soft:#472a37;
        --gold:#d3a94e;
        --green:#7fb08f;
        --line:#4a323e;
        --field:#33202a;
        --tab-bg:#221419;
      }
      *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
      html,body{margin:0;padding:0}
      body{
        font-family:var(--sans);
        background:var(--paper-deep);
        color:var(--ink);
        font-size:15px;
        line-height:1.55;
      }
      /* faint ledger ruling on the backdrop */
      body::before{
        content:"";position:fixed;inset:0;pointer-events:none;
        background:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(120,100,50,.05) 31px 32px);
      }
      #app{
        max-width:470px;margin:0 auto;min-height:100dvh;
        background:var(--paper);
        box-shadow:0 0 0 1px var(--card-edge),var(--shadow);
        display:flex;flex-direction:column;position:relative;
      }
      main{flex:1;padding:14px 14px 96px}
      button,[role="button"],select,input:not([type="checkbox"]){min-height:38px}
      button{font-family:var(--sans);cursor:pointer}
      .hidden{display:none!important}

      /* ---------- payslip ---------- */
      .slip{
        background:var(--card);
        border:1.5px solid var(--ink);
        outline:3px solid var(--card);
        box-shadow:0 0 0 4.5px var(--ink);
        margin:6px 2px 16px;
        padding:16px 16px 14px;
        position:relative;
      }
      .slip::after{ /* perforated bottom edge */
        content:"";position:absolute;left:0;right:0;bottom:-9px;height:6px;
        background:radial-gradient(circle at 6px 3px,var(--paper) 2.6px,transparent 3px) repeat-x;
        background-size:14px 6px;
      }
      .slip-head{
        display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
        border-bottom:2.5px double var(--ink);padding-bottom:10px;
      }
      .slip-title{font-family:var(--serif);font-weight:800;font-size:21px;letter-spacing:.14em}
      .slip-sub{font-size:11.5px;color:var(--ink-soft);letter-spacing:.06em;margin-top:2px}
      .hanko{
        flex:none;width:52px;height:52px;border:2.5px solid var(--red);border-radius:6px;
        color:var(--red);display:flex;align-items:center;justify-content:center;
        font-family:var(--serif);font-weight:800;font-size:15px;line-height:1.15;text-align:center;
        transform:rotate(-5deg);opacity:.92;letter-spacing:.05em;
        box-shadow:inset 0 0 0 1.5px var(--card),inset 0 0 0 3px var(--red);
        padding:4px;
      }
      .period-nav{display:flex;align-items:center;gap:8px;margin-top:12px}
      .period-nav .p-label{flex:1;text-align:center}
      .p-range{font-family:var(--serif);font-weight:700;font-size:16.5px}
      .p-payday{font-size:12.5px;color:var(--red);font-weight:700;margin-top:1px}
      .nav-btn{
        width:42px;height:42px;flex:none;border:1.5px solid var(--ink);background:var(--card);
        color:var(--ink);font-size:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;
      }
      .nav-btn:active{transform:translateY(1px)}
      .gross{margin:14px 0 4px;text-align:center}
      .gross .g-label{font-size:12px;letter-spacing:.28em;color:var(--ink-soft)}
      .gross .g-amount{font-family:var(--serif);font-weight:800;font-size:44px;line-height:1.1;letter-spacing:.01em}
      .gross .g-amount small{font-size:20px;font-weight:700}
      .slip-rows{margin-top:10px;border-top:1px solid var(--line)}
      .srow{
        display:flex;justify-content:space-between;align-items:baseline;gap:12px;
        padding:7px 1px;border-bottom:1px dashed var(--line);font-size:14px;
      }
      .srow .k{color:var(--ink-soft)}
      .srow .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
      .srow .v.neg{color:var(--red)}
      .slip-actions{display:flex;gap:8px;margin-top:14px}
      .btn{
        border:1.5px solid var(--ink);background:var(--card);color:var(--ink);
        padding:9px 12px;font-size:13.5px;font-weight:700;border-radius:4px;flex:1;
        display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
      }
      .btn.primary{background:var(--ink);color:var(--paper)}
      .btn.red{background:var(--red);border-color:var(--red);color:#fff}
      .btn:active{transform:translateY(1px)}
      .btn.small{flex:none;min-height:38px;padding:6px 12px}

      .section-head{
        display:flex;align-items:baseline;justify-content:space-between;gap:10px;
        margin:22px 2px 10px;
      }
      .section-head h2{font-family:var(--serif);font-size:17px;font-weight:800;letter-spacing:.08em;margin:0}
      .section-head .hint{font-size:12px;color:var(--ink-faint)}

      /* daily record rows */
      .dayrow{
        width:100%;text-align:left;background:var(--card);border:1px solid var(--card-edge);
        border-left:4px solid var(--ink);border-radius:3px;padding:10px 12px;margin-bottom:8px;
        display:flex;gap:12px;align-items:center;color:var(--ink);
      }
      .dayrow.sun,.dayrow.hol{border-left-color:var(--red)}
      .dayrow .d-num{font-family:var(--serif);font-weight:800;font-size:20px;width:34px;text-align:center;line-height:1}
      .dayrow .d-num small{display:block;font-size:10.5px;font-weight:700;color:var(--ink-soft);margin-top:3px;font-family:var(--sans)}
      .dayrow.sun .d-num,.dayrow.hol .d-num{color:var(--red)}
      .dayrow .d-main{flex:1;min-width:0}
      .dayrow .d-shifts{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .dayrow .d-meta{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .dayrow .d-amt{font-family:var(--serif);font-weight:800;font-size:16px;white-space:nowrap}
      .empty{
        border:1.5px dashed var(--card-edge);border-radius:4px;padding:22px 16px;text-align:center;
        color:var(--ink-soft);font-size:13.5px;background:var(--field);
      }

      /* ---------- calendar ---------- */
      .cal-head{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
      .cal-head .c-title{flex:1;text-align:center;font-family:var(--serif);font-weight:800;font-size:19px;letter-spacing:.05em}
      .cal-card{background:var(--card);border:1px solid var(--card-edge);border-radius:4px;padding:10px 8px 12px}
      .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
      .cal-dow{text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-soft);padding:4px 0 6px}
      .cal-dow.sun{color:var(--red)}
      .cal-cell{
        border:none;background:transparent;color:var(--ink);border-radius:4px;
        min-height:56px;padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;
        font-family:var(--sans);position:relative;
      }
      .cal-cell .n{font-family:var(--serif);font-weight:700;font-size:15.5px;line-height:1.15}
      .cal-cell.sun .n,.cal-cell.hol .n{color:var(--red)}
      .cal-cell.out{opacity:.32}
      .cal-cell.today{box-shadow:inset 0 0 0 1.5px var(--gold)}
      .cal-cell.inperiod{background:var(--field)}
      .cal-cell .holname{font-size:8.6px;line-height:1.2;color:var(--red);text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
      .cal-cell .amt{font-size:9.5px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;line-height:1.2}
      .cal-cell .dots{display:flex;gap:3px;height:5px}
      .cal-cell .dot{width:5px;height:5px;border-radius:50%}
      .dot.day{background:var(--gold)} .dot.eve{background:var(--ink)}
      .cal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);margin-top:10px;padding:0 2px}
      .cal-legend span{display:inline-flex;align-items:center;gap:5px}
      .cal-legend .dot{width:7px;height:7px;border-radius:50%;display:inline-block}

      /* ---------- history ---------- */
      .histrow{
        width:100%;text-align:left;background:var(--card);border:1px solid var(--card-edge);border-radius:3px;
        padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;color:var(--ink);
      }
      .histrow .h-main{flex:1;min-width:0}
      .histrow .h-range{font-family:var(--serif);font-weight:800;font-size:15.5px}
      .histrow .h-meta{font-size:12px;color:var(--ink-soft);margin-top:2px}
      .histrow .h-amt{font-family:var(--serif);font-weight:800;font-size:18px;white-space:nowrap}
      .histrow.current{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--red)}

      /* ---------- settings ---------- */
      .card{background:var(--card);border:1px solid var(--card-edge);border-radius:4px;padding:14px;margin-bottom:14px}
      .card h3{font-family:var(--serif);font-size:15.5px;font-weight:800;letter-spacing:.06em;margin:0 0 4px}
      .card .desc{font-size:12.5px;color:var(--ink-soft);margin:0 0 10px}
      .field{margin-bottom:10px}
      .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:4px}
      .field input,.field select{
        width:100%;border:1.5px solid var(--card-edge);background:var(--field);color:var(--ink);
        border-radius:4px;padding:8px 10px;font-size:15px;font-family:var(--sans);min-height:42px;
      }
      .field input:focus,.field select:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
      .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
      .seg{display:flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
      .seg button{flex:1;border:none;background:var(--card);color:var(--ink);font-weight:700;font-size:13.5px;padding:9px 4px;min-height:42px}
      .seg button.on{background:var(--ink);color:var(--paper)}
      .tpl-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
      .tpl-row:last-child{border-bottom:none}
      .tpl-row .wd{width:40px;flex:none;font-weight:800;font-size:13.5px}
      .tpl-row .wd.sun{color:var(--red)}
      .tpl-row select{flex:1;border:1.5px solid var(--card-edge);background:var(--field);color:var(--ink);border-radius:4px;padding:6px 8px;font-size:13.5px;min-height:40px}
      .tpl-row input[type="time"]{width:104px;flex:none;border:1.5px solid var(--card-edge);background:var(--field);color:var(--ink);border-radius:4px;padding:6px;font-size:13.5px;min-height:40px}
      .tpl-row .dash{color:var(--ink-faint);flex:none}
      .dayrow.excluded{opacity:.58}
      .dayrow.excluded .d-amt{text-decoration:line-through;font-size:14px}
      .cal-cell.excluded .amt{display:none}
      .excluded-note{font-size:12px;font-weight:700;color:var(--red);margin-top:6px}

      /* ---------- tab bar ---------- */
      .tabbar{
        position:fixed;bottom:0;left:50%;transform:translateX(-50%);
        width:100%;max-width:470px;background:var(--tab-bg);
        border-top:1.5px solid var(--ink);
        display:grid;grid-template-columns:repeat(4,1fr);
        padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40;
      }
      .tabbar button{
        border:none;background:transparent;color:var(--ink-soft);
        display:flex;flex-direction:column;align-items:center;gap:2px;
        font-size:11px;font-weight:700;padding:6px 2px;min-height:52px;border-radius:4px;
      }
      .tabbar button svg{width:22px;height:22px}
      .tabbar button.on{color:var(--red)}
      .tabbar button.on .tab-jp{color:var(--red)}
      .tab-jp{font-family:var(--serif);font-size:13px;font-weight:800;color:var(--ink);letter-spacing:.1em}

      /* ---------- sheet (day editor) ---------- */
      .sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
      .sheet-bg{position:absolute;inset:0;background:rgba(10,14,24,.55)}
      .sheet{
        position:relative;width:100%;max-width:470px;max-height:92dvh;overflow-y:auto;
        background:var(--paper);border-top:2px solid var(--ink);border-radius:10px 10px 0 0;
        padding:16px 16px calc(20px + env(safe-area-inset-bottom));
        animation:up .22s ease;
      }
      @keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
      @media (prefers-reduced-motion:reduce){.sheet{animation:none}}
      .sheet h3{font-family:var(--serif);font-size:19px;font-weight:800;margin:0}
      .sheet .hol-line{font-size:13px;margin:4px 0 0}
      .sheet .hol-line .rn{color:var(--red);font-weight:700}
      .shift-card{background:var(--card);border:1px solid var(--card-edge);border-left:4px solid var(--gold);border-radius:3px;padding:12px;margin-top:12px}
      .shift-card.eve{border-left-color:var(--ink)}
      .shift-card .sc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
      .shift-card .sc-type{font-weight:900;font-size:14px;letter-spacing:.04em}
      .icon-btn{border:1px solid var(--card-edge);background:var(--field);color:var(--red);border-radius:4px;width:38px;height:38px;font-size:16px;display:flex;align-items:center;justify-content:center}
      .sc-result{
        margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;
        display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-soft);
      }
      .sc-result b{color:var(--ink);font-variant-numeric:tabular-nums}
      .sc-result .earn{font-family:var(--serif);font-size:16px;color:var(--ink)}
      .sheet-actions{display:flex;gap:8px;margin-top:14px}
      .toast{
        position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
        background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:4px;font-size:13.5px;font-weight:700;
        opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:88vw;text-align:center;
      }
      .toast.show{opacity:1;transform:translateX(-50%)}
      .view-title{font-family:var(--serif);font-size:20px;font-weight:800;letter-spacing:.1em;margin:2px 0 2px}
      .view-sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 12px}

      /* ---------- welcome gate (character pick + celebration) ---------- */
      #gate{
        position:fixed;inset:0;z-index:90;overflow-y:auto;
        background:var(--paper-deep);
      }
      .gate-inner{
        max-width:470px;margin:0 auto;min-height:100dvh;
        background:var(--paper);
        box-shadow:0 0 0 1px var(--card-edge),var(--shadow);
        padding:36px 20px calc(34px + env(safe-area-inset-bottom));
        display:flex;flex-direction:column;justify-content:center;
      }
      .gate-title{font-family:var(--serif);font-size:28px;font-weight:800;text-align:center;margin:0 0 8px;letter-spacing:.04em}
      .gate-sub{text-align:center;color:var(--ink-soft);font-size:14.5px;margin:0 auto 24px;max-width:340px}
      .gate-choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
      .gate-choice{
        background:var(--card);border:1.5px solid var(--card-edge);border-radius:8px;
        padding:10px 8px 13px;display:flex;flex-direction:column;align-items:center;gap:9px;
        color:var(--ink);box-shadow:var(--shadow);
      }
      .gate-choice img{width:100%;height:auto;border-radius:5px;display:block}
      .gate-choice span{font-weight:900;font-size:16.5px;letter-spacing:.02em}
      .gate-choice:active{transform:translateY(1px)}
      .cheer-img{display:block;margin:0 auto 18px;max-width:76%;max-height:42dvh;width:auto;height:auto;border-radius:8px}
      .cheer-card{
        background:var(--card);border:1.5px solid var(--ink);border-radius:6px;
        box-shadow:0 0 0 3px var(--card),0 0 0 4.5px var(--ink);
        padding:18px 16px 16px;text-align:center;position:relative;
      }
      .cheer-stamp{
        position:absolute;top:-19px;right:12px;width:44px;height:44px;
        border:2.5px solid var(--red);border-radius:6px;color:var(--red);
        background:var(--card);
        display:flex;align-items:center;justify-content:center;
        font-family:var(--serif);font-weight:800;font-size:16px;
        transform:rotate(6deg);
        box-shadow:inset 0 0 0 1.5px var(--card),inset 0 0 0 3px var(--red);
      }
      .cheer-card h2{font-family:var(--serif);font-size:23px;font-weight:800;margin:2px 0 8px;letter-spacing:.05em}
      .cheer-card p{color:var(--ink-soft);font-size:14.5px;margin:0 0 16px}
      .cheer-card .btn{width:100%}
      .gate-pop{animation:pop .3s ease}
      @keyframes pop{from{transform:scale(.96);opacity:.3}to{transform:none;opacity:1}}
      @media (prefers-reduced-motion:reduce){.gate-pop{animation:none}}
      .credit-footer{
        text-align:center;font-size:12.5px;color:var(--ink-faint);letter-spacing:.03em;
        margin:24px 2px 4px;padding-top:12px;border-top:1px dashed var(--line);
      }
    </style>
  </head>
  <body>
    <!-- WELCOME GATE: pick a character, get celebrated, then enter the payslip -->
    <div id="gate">
      <div class="gate-inner">
        <div id="gatePick">
          <h1 class="gate-title" id="pickTitle"></h1>
          <p class="gate-sub" id="pickSub"></p>

    function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

    /* ================= dashboard ================= */
    function renderSlip(){
      $("slipSub").textContent = t("slipSub");
      $("grossLabel").textContent = t("gross");
      $("applyTpl").textContent = t("applyTpl");
      $("periodRange").textContent = fmtDateShort(curPeriod.start) + " – " + fmtDateShort(curPeriod.end);
      $("periodPayday").textContent = t("payday") + ": " + fmtDate(curPeriod.payday);
      var tot = periodTotals(curPeriod);
      $("grossAmount").textContent = fmtYen(tot.gross);
      var rows = [
        ["rDayEarn", "¥" + fmtYen(tot.dayEarn), ""],
        ["rEveEarn", "¥" + fmtYen(tot.eveEarn), ""],
        ["rDays", tot.days + " " + t("daysUnit"), ""],
        ["rHours", fmtHM(tot.payable), ""],
        ["rLate", tot.late + " " + t("minutes"), tot.late ? "neg" : ""],
        ["rEarly", tot.early + " " + t("minutes"), tot.early ? "neg" : ""],
        ["rBreak", fmtHM(tot.breakMin), ""],
        ["rHolHours", fmtHM(tot.holPayable), ""]
      ];
      $("slipRows").innerHTML = rows.map(function(r){
        return '<div class="srow"><span class="k">' + esc(t(r[0])) + '</span><span class="v ' + r[2] + '">' + esc(r[1]) + "</span></div>";
      }).join("");
      /* daily list */
      $("dailyTitle").textContent = t("dailyTitle");
      $("dailyHint").textContent = t("dailyHint");
      var html = "", any = false;
      var d = dateOf(curPeriod.start), end = dateOf(curPeriod.end);
      var items = [];
      while (d <= end){
        var k = dkey(d.getFullYear(), d.getMonth()+1, d.getDate());
        if (dayShifts(k).length) items.push(k);
        d.setDate(d.getDate()+1);
      }
      items.sort().reverse().forEach(function(k){
        any = true;
        var dt = dateOf(k), tot2 = dayTotal(k), hn = holidayName(k);
        var isSun = dt.getDay() === 0;
        var excluded = isExcluded(k);
        var shiftTxt = dayShifts(k).map(function(sh){
          return (sh.type === "day" ? t("dayShift") : t("eveShift")) + " " + sh.actIn + "–" + sh.actOut;
        }).join(" · ");
        var meta = [];
        if (hn) meta.push(hn); else if (isSun) meta.push(t("sunday"));
        if (excluded) meta.push(t("redExcluded"));
        else {
          meta.push(fmtHM(tot2.payable));
          if (tot2.late) meta.push(t("late") + " " + tot2.late + t("minutes"));
          if (tot2.early) meta.push(t("early") + " " + tot2.early + t("minutes"));

        (c.early ? "<span>" + esc(t("early")) + " <b>" + c.early + esc(t("minutes")) + "</b></span>" : "") +

    function bindShiftCards(){
      Array.prototype.forEach.call(document.querySelectorAll("#shiftList .shift-card"), function(card){
        var idx = +card.getAttribute("data-idx");
        function upd(field, val){
          var arr = state.records[sheetDate]; if (!arr || !arr[idx]) return;
          arr[idx][field] = val; save();
          var c = calcShift(arr[idx]);
          var res = card.querySelector(".sc-result");
          res.innerHTML =
            "<span>" + esc(t("payable")) + " <b>" + fmtHM(c.payable) + "</b></span>" +
            "<span>" + esc(t("brk")) + " <b>" + c.breakMin + esc(t("minutes")) + "</b></span>" +
            (c.late ? "<span>" + esc(t("late")) + " <b>" + c.late + esc(t("minutes")) + "</b></span>" : "") +
            (c.early ? "<span>" + esc(t("early")) + " <b>" + c.early + esc(t("minutes")) + "</b></span>" : "") +
            '<span class="earn">¥' + fmtYen(c.earn) + "</span>";
          renderAll();
        }
        card.querySelector(".f-ss").addEventListener("change", function(e){ upd("schedS", e.target.value); });
        card.querySelector(".f-se").addEventListener("change", function(e){ upd("schedE", e.target.value); });
        card.querySelector(".f-ai").addEventListener("change", function(e){ upd("actIn", e.target.value); });
        card.querySelector(".f-ao").addEventListener("change", function(e){ upd("actOut", e.target.value); });
      });
      Array.prototype.forEach.call(document.querySelectorAll("#shiftList .sc-del"), function(btn){
        btn.addEventListener("click", function(){
          var idx = +btn.getAttribute("data-idx");
          state.records[sheetDate].splice(idx, 1);
          if (!state.records[sheetDate].length) delete state.records[sheetDate];
          save(); renderSheet(); renderAll();
        });
      });

    function addShift(type){
      var sh = type === "day"
        ? { type:"day", schedS:"07:00", schedE:"16:00", actIn:"07:00", actOut:"16:00" }
        : { type:"evening", schedS:"18:00", schedE:"22:45", actIn:"18:00", actOut:"22:45" };
      if (!state.records[sheetDate]) state.records[sheetDate] = [];
      state.records[sheetDate].push(sh);
      save(); renderSheet(); renderAll();
    }

    /* ================= exports ================= */
    function periodRows(){
      var rows = [];
      var d = dateOf(curPeriod.start), end = dateOf(curPeriod.end);
      while (d <= end){
        var k = dkey(d.getFullYear(), d.getMonth()+1, d.getDate());
        var hn = holidayName(k) || (d.getDay() === 0 ? "Sunday" : "");
        if (isExcluded(k)){ d.setDate(d.getDate()+1); continue; }
        dayShifts(k).forEach(function(sh){
          var c = calcShift(sh);
          rows.push([k, hn, sh.type, sh.schedS, sh.schedE, sh.actIn, sh.actOut, c.payable, c.breakMin, c.late, c.early, c.earn]);
        });
        d.setDate(d.getDate()+1);
      }
      return rows;
    }
    function download(name, blob){
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
    }
    function exportCSV(){
      var head = "Date,Holiday,Shift,Scheduled Start,Scheduled End,Clock In,Clock Out,Payable Minutes,Break Minutes,Late Minutes,Early Minutes,Earnings (JPY)";
      var lines = periodRows().map(function(r){ return r.join(","); });
      var tot = periodTotals(curPeriod);
      lines.push("TOTAL,,,,,,,," + tot.payable + "," + tot.breakMin + "," + tot.late + "," + tot.early + "," + tot.gross);
      var csv = "﻿" + head + "\n" + lines.join("\n");
      download("salary-" + curPeriod.start + "_to_" + curPeriod.end + ".csv", new Blob([csv], { type:"text/csv;charset=utf-8" }));
    }
    function exportPDF(){
      var rows = periodRows(), tot = periodTotals(curPeriod);
      if (window.jspdf && window.jspdf.jsPDF){
        var doc = new window.jspdf.jsPDF();
        doc.setFontSize(15);
        doc.text("Salary Report  " + curPeriod.start + " - " + curPeriod.end, 14, 16);
        doc.setFontSize(11);
        doc.text("Payday: " + curPeriod.payday + "    Total gross: JPY " + fmtYen(tot.gross), 14, 24);
        doc.text("Working days: " + tot.days + "    Payable: " + Math.floor(tot.payable/60) + "h " + (tot.payable%60) + "m    Late: " + tot.late + "m    Early: " + tot.early + "m", 14, 31);
        var y = 42;
        doc.setFontSize(9.5);
        doc.text("Date        Shift     Sched        Actual       Payable  Late  Early  Earnings", 14, y); y += 3;
        doc.line(14, y, 196, y); y += 6;
        rows.forEach(function(r){
          if (y > 282){ doc.addPage(); y = 16; }
          var line = r[0] + "  " + (r[2] === "day" ? "Day    " : "Evening") + "  " + r[3] + "-" + r[4] + "  " + r[5] + "-" + r[6] + "   " +
            String(r[7]).padStart(4) + "m   " + String(r[9]).padStart(3) + "m  " + String(r[10]).padStart(3) + "m   JPY " + fmtYen(r[11]);
          doc.text(line, 14, y); y += 5.5;
        });
        doc.save("salary-" + curPeriod.start + "_to_" + curPeriod.end + ".pdf");
      } else {
        exportCSV();
        toast("PDF unavailable offline — CSV saved");
      }
    }

    /* ================= template fill ================= */
    function applyTemplate(){
      var d = dateOf(curPeriod.start), end = dateOf(curPeriod.end), added = 0;
      while (d <= end){
        var k = dkey(d.getFullYear(), d.getMonth()+1, d.getDate());
        if (!dayShifts(k).length && !isExcluded(k)){
          var tp = state.template[String(d.getDay())];
          if (tp){
            state.records[k] = [{ type: tp.type, schedS: tp.s, schedE: tp.e, actIn: tp.s, actOut: tp.e }];
            added++;
          }
        }
        d.setDate(d.getDate()+1);
      }
      save(); renderAll();
      if (added) toast(t("appliedTpl"));
    }

      for (var wd = 0; wd < 7; wd++){
        var type = $("tplRows").querySelector('.tpl-type[data-wd="' + wd + '"]').value;
        if (type === "off") state.template[String(wd)] = null;
        else state.template[String(wd)] = {
          type: type,
          s: $("tplRows").querySelector('.tpl-s[data-wd="' + wd + '"]').value || "07:00",
          e: $("tplRows").querySelector('.tpl-e[data-wd="' + wd + '"]').value || "16:00"
        };
      }
      save(); toast(t("saved"));
    });
    var wipeArmed = false;
    $("wipeData").addEventListener("click", function(){
      if (!wipeArmed){
        wipeArmed = true; $("wipeData").textContent = t("wipeConfirm");
        setTimeout(function(){ wipeArmed = false; $("wipeData").textContent = t("wipe"); }, 3500);
        return;
      }
      state.records = {}; state.holidayOverrides = {};
      save(); wipeArmed = false; renderAll(); toast(t("saved"));
    });

    applyTheme();
    applyGender();
    switchView("slip");
    renderAll();
    if (state.gender) $("gate").classList.add("hidden");
    </script>
  </body>
</html>
