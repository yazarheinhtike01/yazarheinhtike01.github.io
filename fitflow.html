<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>FitFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Myanmar:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --surface2:#F1F5F9; --line:#E2E8F0;
  --ink:#0F172A; --ink2:#334155; --mut:#64748B;
  --green:#16A34A; --green-d:#15803D; --green-soft:#DCFCE7; --green-soft2:#F0FDF4;
  --blue:#0284C7; --blue-soft:#E0F2FE;
  --amber:#D97706; --amber-soft:#FEF3C7;
  --red:#DC2626; --red-soft:#FEE2E2;
  --violet:#7C3AED; --violet-soft:#EDE9FE;
  --teal:#0D9488; --teal-soft:#CCFBF1;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.05);
  --shadow-lg:0 12px 40px rgba(15,23,42,.18);
  --r:16px;
}
[data-theme="dark"]{
  --bg:#0B1220; --surface:#111C2E; --surface2:#1B2A42; --line:#22334F;
  --ink:#E8EEF7; --ink2:#C3CFDE; --mut:#8FA3BC;
  --green-soft:#123B24; --green-soft2:#0E2C1B;
  --blue-soft:#0C2D42; --amber-soft:#3A2A08; --red-soft:#3B1414;
  --violet-soft:#2A1D4D; --teal-soft:#0B2E2A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.3);
  --shadow-lg:0 12px 40px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Manrope","Noto Sans JP","Noto Sans Myanmar",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
button,[role="button"],select,input:not([type="checkbox"]){min-height:2.5rem}
a{color:var(--green-d)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100dvh}
.sidebar{width:236px;flex:0 0 236px;background:var(--surface);border-right:1px solid var(--line);
  position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;padding:20px 14px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center;flex:0 0 38px}
.brand-mark svg{width:22px;height:22px}
.brand b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;color:var(--mut);font-size:11px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--ink2);
  font-weight:600;font-size:14.5px;text-align:left;min-height:44px;transition:background .15s,color .15s;width:100%}
.nav button svg{width:20px;height:20px;flex:0 0 20px}
.nav button:hover{background:var(--surface2)}
.nav button.on{background:var(--green-soft);color:var(--green-d)}
[data-theme="dark"] .nav button.on{color:#4ADE80}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}
.streak-mini{display:flex;gap:10px;align-items:center;background:var(--green-soft2);border:1px solid var(--green-soft);
  border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
.streak-mini svg{width:20px;height:20px;color:var(--amber);flex:0 0 20px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--line)}
.topbar .page-title{font-size:17px;font-weight:800;letter-spacing:-.01em;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:0 12px;min-height:42px;width:min(320px,38vw)}
.searchbox svg{width:18px;height:18px;color:var(--mut);flex:0 0 18px}
.searchbox input{border:0;background:none;outline:none;width:100%;min-height:40px;font-size:14px}
.icon-btn{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--surface);
  border:1px solid var(--line);position:relative;flex:0 0 42px}
.icon-btn svg{width:20px;height:20px}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--surface)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;display:grid;place-items:center;flex:0 0 42px;font-size:16px}
.langsel{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.langsel button{padding:0 11px;font-weight:700;font-size:13px;color:var(--mut);min-height:42px;white-space:nowrap}
.langsel .short{display:none}
.langsel button.on{background:var(--green);color:#fff}
.content{padding:22px;max-width:1180px;width:100%;margin:0 auto}
.bottomnav{display:none}

/* ---------- Common ---------- */
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em;font-weight:800}
h2{font-size:17px;margin:0;font-weight:800;letter-spacing:-.01em}
h3{font-size:15px;margin:0;font-weight:700}
.sub{color:var(--mut);font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--green);color:#fff;
  font-weight:700;border-radius:11px;padding:10px 18px;min-height:44px;font-size:14.5px;transition:background .15s,transform .1s}
.btn:hover{background:var(--green-d)} .btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.soft{background:var(--green-soft);color:var(--green-d)}
[data-theme="dark"] .btn.soft{color:#4ADE80}
.btn.danger{background:var(--red)} .btn.danger:hover{background:#B91C1C}
.btn.sm{min-height:38px;padding:6px 13px;font-size:13.5px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);font-weight:600;font-size:13.5px;min-height:38px;color:var(--ink2)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:700;color:var(--ink2)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;min-height:44px;width:100%;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green)}
.field .err{color:var(--red);font-size:12.5px;font-weight:600;display:none}
.field.invalid input{border-color:var(--red)} .field.invalid .err{display:block}
.progress{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s ease}
.progress.blue>i{background:var(--blue)} .progress.amber>i{background:var(--amber)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--mut)}
.empty svg{width:34px;height:34px;margin-bottom:8px;color:var(--mut)}
.empty b{color:var(--ink2);display:block;font-size:15px;margin-bottom:2px}
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.tag.g{background:var(--green-soft);color:var(--green-d)} [data-theme="dark"] .tag.g{color:#4ADE80}
.tag.b{background:var(--blue-soft);color:var(--blue)} .tag.a{background:var(--amber-soft);color:var(--amber)}
.tag.r{background:var(--red-soft);color:var(--red)} .tag.v{background:var(--violet-soft);color:var(--violet)}
.tag.t{background:var(--teal-soft);color:var(--teal)} .tag.s{background:var(--surface2);color:var(--mut)}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.icon-tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:0 0 44px}
.icon-tile svg{width:22px;height:22px}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0;padding-bottom:0}
.list-row:first-child{padding-top:0}
.del-btn{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--mut);flex:0 0 38px}
.del-btn:hover{background:var(--red-soft);color:var(--red)} .del-btn svg{width:18px;height:18px}

/* stat cards */
.stat-cards{grid-template-columns:repeat(4,1fr)}
.stat .big{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.stat .lbl{color:var(--mut);font-size:13px;font-weight:600}
.ring-wrap{display:flex;align-items:center;gap:14px}
.ring{transform:rotate(-90deg)}
.ring .track{stroke:var(--surface2)} .ring .val{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring.blue .val{stroke:var(--blue)}

/* exercise cards */
.ex-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.ex-art{height:110px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px;position:relative;overflow:hidden}
.ex-art svg{width:52px;height:52px}
.ex-art .diff{position:absolute;top:10px;right:10px}

/* modal / toast */
.overlay{position:fixed;inset:0;background:rgba(8,15,30,.55);z-index:60;display:none;align-items:flex-end;justify-content:center;padding:0}
.overlay.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88dvh;overflow:auto;border-radius:20px 20px 0 0;padding:22px;box-shadow:var(--shadow-lg)}
@media(min-width:640px){.overlay{align-items:center;padding:20px}.sheet{border-radius:20px}}
#toasts{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
@media(min-width:900px){#toasts{bottom:26px}}
.toast{background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow-lg);
  display:flex;gap:8px;align-items:center;animation:tin .25s ease}
.toast.ok{background:var(--green-d);color:#fff}.toast.bad{background:var(--red);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* water */
.water-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.water-btns button{background:var(--blue-soft);color:var(--blue);border-radius:12px;padding:14px 6px;font-weight:800;font-size:16px;min-height:56px}
.water-btns button small{display:block;font-size:12px;font-weight:600}
.wbars{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:8px}
.wbars .wb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wbars .wb i{display:block;width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--blue);min-height:3px}
.wbars .wb span{font-size:11.5px;color:var(--mut);font-weight:600}

/* weekly bars */
.wk{display:flex;align-items:stretch;gap:10px;height:150px}
.wk .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.wk .track{flex:1;width:100%;max-width:48px;background:var(--surface2);border-radius:9px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.wk .col i{display:block;width:100%;background:var(--green);border-radius:8px 8px 0 0;min-height:0}
.wk .col em{font-style:normal;font-size:12px;color:var(--mut);font-weight:700}
.wk .col b{font-size:12.5px}

/* settings rows */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.switch{width:52px;height:30px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:0 0 52px;min-height:30px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);transition:left .18s}
.switch.on{background:var(--green);border-color:var(--green)} .switch.on::after{left:25px;background:#fff}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 13px;border-radius:8px;font-weight:700;font-size:13px;color:var(--mut);min-height:36px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* routine */
.routine-ex{display:flex;gap:10px;align-items:center;background:var(--surface2);border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:600}
.check-btn{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:0 0 26px;background:var(--surface);min-height:26px}
.check-btn.done{background:var(--green);border-color:var(--green);color:#fff}
.check-btn svg{width:15px;height:15px}

/* footer note */
.foot-note{color:var(--mut);font-size:12.5px;text-align:center;padding:8px 0 4px}

/* ---------- Responsive ---------- */
@media(max-width:1100px){.stat-cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:899px){
  .sidebar{display:none}
  .langsel .full{display:none}.langsel .short{display:inline}
  .langsel button{padding:0 9px;min-height:40px}
  .topbar{gap:8px}.icon-btn{width:40px;height:40px;flex-basis:40px}.avatar{width:40px;height:40px;flex-basis:40px}
  .content{padding:16px 14px 108px}
  .topbar{padding:10px 14px}
  .searchbox{display:none}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);
    border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottomnav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:700;
    color:var(--mut);padding:6px 2px;min-height:52px;border-radius:10px}
  .bottomnav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bottomnav button svg{width:21px;height:21px}
  .bottomnav button.on{color:var(--green-d)}
  [data-theme="dark"] .bottomnav button.on{color:#4ADE80}
  h1{font-size:22px}
  .stat .big{font-size:23px}
}
@media(max-width:420px){.stat-cards{grid-template-columns:repeat(2,1fr)}}
.dash-2col{grid-template-columns:1.6fr 1fr}
@media(max-width:899px){.dash-2col{grid-template-columns:1fr}}
.two-col{grid-template-columns:1fr 1fr}
@media(max-width:760px){.two-col{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" id="brandMark"></span>
      <span><b>FitFlow</b><small data-i18n="tagline"></small></span>
    </div>
    <nav class="nav" id="sideNav"></nav>
    <div class="side-foot">
      <div class="streak-mini"><span id="flameIc"></span><span id="streakTxt"></span></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-title" id="pageTitle"></div>
      <div class="searchbox"><span data-ic="search"></span><input id="globalSearch" type="search" /></div>
      <div class="langsel" id="langSel" role="group" aria-label="Language">
        <button data-lang="en">EN</button><button data-lang="ja"><span class="full">日本語</span><span class="short">JP</span></button><button data-lang="my"><span class="full">မြန်မာ</span><span class="short">MM</span></button>
      </div>
      <button class="icon-btn" id="bellBtn" aria-label="Notifications"><span data-ic="bell"></span><span class="dot" id="bellDot" hidden></span></button>
      <button class="icon-btn" id="themeBtn" aria-label="Theme"><span data-ic="moon"></span></button>
      <button class="avatar" id="avatarBtn" aria-label="Profile">?</button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<nav class="bottomnav" id="bottomNav"></nav>
<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toasts" aria-live="polite"></div>

<script>

clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',

const KEY="fitflow_v1";
function todayKey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function defaultState(){return {
 profile:{name:"",age:"",gender:"male",heightCm:170,goalType:"maintain",targetKg:"",activity:"moderate"},
 settings:{lang:"en",theme:"auto",units:"metric",calTarget:2200,waterGoal:2500},
 routines:[
  {id:"r1",name:"Full Body Starter",cat:"fullbody",duration:35,items:[{ex:"squat",sets:4,reps:"15",rest:60},{ex:"pushup",sets:4,reps:"12",rest:60},{ex:"row",sets:3,reps:"10",rest:60},{ex:"plank",sets:3,reps:"45 sec",rest:45}]},
  {id:"r2",name:"Upper Body Power",cat:"chest",duration:40,items:[{ex:"benchpress",sets:4,reps:"8",rest:90},{ex:"ohp",sets:3,reps:"10",rest:60},{ex:"curl",sets:3,reps:"12",rest:45},{ex:"dip",sets:3,reps:"12",rest:60}]}
 ],
 history:[],food:{},water:{},weights:[]
};}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||defaultState();}catch(e){S=defaultState();}
if(!S.profile)S=defaultState();
LANG=S.settings.lang||"en";
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function exById(id){return EX.find(function(e){return e.id===id;})||EX[0];}
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function fmtW(kg){if(kg===""||kg==null||isNaN(kg))return "—";if(S.settings.units==="imperial")return (kg*2.20462).toFixed(1)+" "+t("lb");return (+kg).toFixed(1)+" "+t("kg");}
function fmtH(cm){if(!cm)return "—";if(S.settings.units==="imperial"){var inch=cm/2.54;return Math.floor(inch/12)+"'"+Math.round(inch%12)+'"';}return cm+" "+t("cm");}
function toast(msg,kind){var d=document.createElement("div");d.className="toast "+(kind||"");d.textContent=msg;$("#toasts").appendChild(d);setTimeout(function(){d.remove();},2600);}
let VIEW="dashboard", exFilter="all", exQuery="", session=null;
function dayFood(){return S.food[todayKey()]||[];}
function dayWater(){return S.water[todayKey()]||0;}
function foodTotals(){return dayFood().reduce(function(a,f){a.kcal+=+f.kcal||0;a.p+=+f.p||0;a.c+=+f.c||0;a.f+=+f.f||0;return a;},{kcal:0,p:0,c:0,f:0});}
function latestWeight(){if(!S.weights.length)return null;var w=S.weights.slice().sort(function(a,b){return a.date<b.date?-1:1;});return w[w.length-1];}
function bmi(){var w=latestWeight(),h=S.profile.heightCm;if(!w||!h)return null;return w.kg/((h/100)*(h/100));}
function doneToday(){return S.history.some(function(h){return h.date===todayKey();});}
function streak(){var n=0,d=new Date();function active(ds){return S.history.some(function(h){return h.date===ds;})||(S.water[ds]||0)>0||(S.food[ds]||[]).length>0;}
 if(!active(todayKey(d)))d.setDate(d.getDate()-1);
 while(active(todayKey(d))){n++;d.setDate(d.getDate()-1);if(n>366)break;} return n;}
function notifications(){var out=[],rem=S.settings.waterGoal-dayWater();
 if(rem>0)out.push(t("notifWater").replace("{n}",rem));
 if(!doneToday())out.push(t("notifWorkout"));
 if(!dayFood().length)out.push(t("notifFood"));
 if(!out.length)out.push(t("notifNone")); return out;}
function ringSVG(pct,color,size){size=size||92;var r=(size/2)-6,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(1,pct)));
 return '<svg class="ring '+(color||"")+'" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><circle class="track" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke-width="8"/><circle class="val" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke-width="8" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/></svg>';}

 document.getElementById("cfOk").onclick=function(){closeSheet();onOk();};}

 var bTag=b?(b<18.5?["bmiUnder","b"]:b<25?["bmiNormal","g"]:b<30?["bmiOver","a"]:["bmiObese","r"]):null;
 var ms=[];if(ws.length)ms.push("msFirst");if(ws.length>=5)ms.push("msFive");if(S.history.length>=10)ms.push("msTen");if(dayWater()>=S.settings.waterGoal)ms.push("msWater");
 if(S.profile.targetKg&&w&&((+S.profile.targetKg>=ws[0].kg&&w.kg<=+S.profile.targetKg)||(+S.profile.targetKg<ws[0].kg&&w.kg>=+S.profile.targetKg)))ms.push("msGoal");
 var h='<div style="margin-bottom:16px"><h1>'+t("progress")+'</h1><p class="sub" style="margin:0">'+t("weightLog")+'</p></div>'
 +'<div class="grid stat-cards" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">'
 +'<div class="card stat"><div class="big">'+(w?fmtW(w.kg):"—")+'</div><div class="lbl">'+t("currentWeight")+'</div></div>'
 +'<div class="card stat"><div class="big">'+(b?b.toFixed(1):"—")+'</div><div class="lbl">'+t("bmi")+(bTag?' · <span class="tag '+bTag[1]+'">'+t(bTag[0])+'</span>':"")+'</div></div>'
 +'<div class="card stat"><div class="big">'+chgTxt(c7)+'</div><div class="lbl">'+t("change7")+'</div></div>'
 +'<div class="card stat"><div class="big">'+chgTxt(c30)+'</div><div class="lbl">'+t("change30")+'</div></div></div>'
 +'<div class="grid two-col" style="margin-bottom:16px"><div class="card"><div class="row-between" style="margin-bottom:10px"><h2>'+t("weightLog")+'</h2><button class="btn sm" onclick="openWeightForm()">'+ic("plus",15)+' '+t("addWeight")+'</button></div>'
 +(ws.length>1?chart:ws.length===1?'<p class="sub">'+t("avgWeight")+'</p>':'<div class="empty" style="border:0;padding:14px">'+t("noWeights")+'</div>')
 +(ws.length?ws.slice().reverse().slice(0,10).map(function(x){return '<div class="list-row"><span style="flex:1"><b>'+fmtW(x.kg)+'</b> <span class="sub">· '+esc(x.date)+'</span></span><button class="del-btn" onclick="delWeight(\''+x.date+'\','+x.kg+')">'+ic("trash",17)+'</button></div>';}).join(""):"")
 +'</div><div class="card"><h2 style="margin-bottom:12px">'+t("milestones")+'</h2>'
 +(ms.length?ms.map(function(m){return '<div class="list-row"><span class="icon-tile" style="background:var(--amber-soft);color:var(--amber);width:40px;height:40px;flex-basis:40px">'+ic("trophy",19)+'</span><b>'+t(m)+'</b></div>';}).join(""):'<div class="empty" style="border:0;padding:14px">'+t("noWeights")+'</div>')
 +'<p class="sub" style="margin-top:12px">'+t("height")+': '+fmtH(S.profile.heightCm)+' · '+t("sessions")+': '+S.history.length+' '+t("times")+'</p></div></div>';
 return h;}
function vSettings(){var p=S.profile;
 function seg(name,opts,val){return '<div class="seg" data-seg="'+name+'">'+opts.map(function(o){return '<button data-v="'+o[0]+'" class="'+(val===o[0]?"on":"")+'">'+o[1]+'</button>';}).join("")+'</div>';}
 var h='<div style="margin-bottom:16px"><h1>'+t("settings")+'</h1><p class="sub" style="margin:0">'+t("profile")+'</p></div>'
 +'<div class="card" style="margin-bottom:16px"><h2 style="margin-bottom:14px">'+t("profile")+'</h2><form id="profileForm">'
 +'<div class="two-col grid" style="gap:0 14px"><div class="field"><label>'+t("yourName")+'</label><input id="pName" value="'+esc(p.name)+'" placeholder="'+t("profileNamePh")+'"></div>'
 +'<div class="field"><label>'+t("age")+'</label><input id="pAge" type="number" min="5" max="120" value="'+esc(p.age)+'"></div>'
 +'<div class="field"><label>'+t("gender")+'</label><select id="pGender">'+["male","female","other"].map(function(g){return '<option value="'+g+'" '+(p.gender===g?"selected":"")+'>'+t(g)+'</option>';}).join("")+'</select></div>'
 +'<div class="field"><label>'+t("activity")+'</label><select id="pAct">'+["sedentary","light","moderate","active"].map(function(a){return '<option value="'+a+'" '+(p.activity===a?"selected":"")+'>'+t(a)+'</option>';}).join("")+'</select></div>'
 +'<div class="field"><label>'+t("height")+' (cm)</label><input id="pHeight" type="number" min="100" max="250" value="'+esc(p.heightCm)+'"></div>'
 +'<div class="field"><label>'+t("targetWt")+' ('+(S.settings.units==="imperial"?t("lb"):t("kg"))+')</label><input id="pTarget" type="number" step="0.1" min="20" value="'+(p.targetKg?(S.settings.units==="imperial"?(p.targetKg*2.20462).toFixed(1):p.targetKg):"")+'"></div>'
 +'<div class="field"><label>'+t("goalType")+'</label><select id="pGoal">'+["lose","maintain","gain"].map(function(g){return '<option value="'+g+'" '+(p.goalType===g?"selected":"")+'>'+t(g)+'</option>';}).join("")+'</select></div>'
 +'<div class="field"><label>'+t("calTarget")+'</label><input id="pCal" type="number" min="800" max="6000" step="50" value="'+S.settings.calTarget+'"></div></div>'
 +'<button class="btn" type="submit">'+ic("check",17)+' '+t("save")+'</button></form></div>'
 +'<div class="card" style="margin-bottom:16px"><h2 style="margin-bottom:6px">'+t("settings")+'</h2>'
 +'<div class="set-row"><div><b>'+t("language")+'</b><div class="sub">'+t("langSub")+'</div></div><div class="langsel">'+[["en","EN"],["ja","日本語"],["my","မြန်မာ"]].map(function(l){return '<button data-setlang="'+l[0]+'" class="'+(LANG===l[0]?"on":"")+'" style="min-height:40px;padding:0 11px;font-weight:700;font-size:13px;color:'+(LANG===l[0]?"#fff":"var(--mut)")+';background:'+(LANG===l[0]?"var(--green)":"transparent")+'">'+l[1]+'</button>';}).join("")+'</div></div>'
 +'<div class="set-row"><div><b>'+t("theme")+'</b><div class="sub">'+t("themeSub")+'</div></div><button class="switch '+(document.documentElement.dataset.theme==="dark"?"on":"")+'" id="themeSwitch" aria-label="'+t("theme")+'"></button></div>'
 +'<div class="set-row"><div><b>'+t("weightUnit")+'</b><div class="sub">'+t("units")+'</div></div>'+seg("wunit",[["metric","kg"],["imperial","lb"]],S.settings.units)+'</div>'
 +'<div class="set-row"><div><b>'+t("heightUnit")+'</b><div class="sub">'+t("units")+'</div></div>'+seg("hunit",[["metric","cm"],["imperial","ft/in"]],S.settings.units)+'</div></div>'
 +'<div class="card"><h2 style="margin-bottom:6px;color:var(--red)">'+t("dangerZone")+'</h2><div class="set-row"><div><b>'+t("resetAll")+'</b><div class="sub">FitFlow</div></div><button class="btn danger sm" onclick="resetAll()">'+t("delete")+'</button></div></div>'
 +'<p class="foot-note">FitFlow · v1.0</p>';
 return h;}
/* ================= Bind & actions ================= */
function bind(){
 if(VIEW==="exercises"){var si=$("#exSearch");if(si){si.addEventListener("input",function(){exQuery=si.value;var pos=si.selectionStart;render();var n=$("#exSearch");n.focus();n.setSelectionRange(pos,pos);});}
  document.querySelectorAll("[data-cat]").forEach(function(b){b.onclick=function(){exFilter=b.dataset.cat;render();};});}
 if(VIEW==="nutrition"){var f=$("#foodForm");if(f)f.addEventListener("submit",function(e){e.preventDefault();
  var name=$("#fName").value.trim(),kcal=parseFloat($("#fKcal").value);
  if(!name){$("#fName").closest(".field").classList.add("invalid");$("#fName").focus();return;}
  if(isNaN(kcal)||kcal<0){toast(t("invalidNum"),"bad");return;}
  if(!S.food[todayKey()])S.food[todayKey()]=[];
  S.food[todayKey()].push({name:name,kcal:kcal,p:parseFloat($("#fP").value)||0,c:parseFloat($("#fC").value)||0,f:parseFloat($("#fF").value)||0});
  save();toast(t("foodAdded"),"ok");render();});}
 if(VIEW==="settings"){var pf=$("#profileForm");if(pf)pf.addEventListener("submit",function(e){e.preventDefault();
   var h=parseFloat($("#pHeight").value);if(isNaN(h)||h<100||h>250){toast(t("invalidNum"),"bad");return;}
   var tg=parseFloat($("#pTarget").value);
   S.profile.name=$("#pName").value.trim();S.profile.age=$("#pAge").value;S.profile.gender=$("#pGender").value;
   S.profile.activity=$("#pAct").value;S.profile.heightCm=h;S.profile.goalType=$("#pGoal").value;
   S.profile.targetKg=isNaN(tg)?"":(S.settings.units==="imperial"?+(tg/2.20462).toFixed(1):tg);
   var cal=parseInt($("#pCal").value,10);if(!isNaN(cal)&&cal>=800&&cal<=6000)S.settings.calTarget=cal;
   save();toast(t("savedSettings"),"ok");renderNav();render();});
  document.querySelectorAll("[data-setlang]").forEach(function(b){b.onclick=function(){setLang(b.dataset.setlang);};});
  var ts=$("#themeSwitch");if(ts)ts.onclick=function(){var dark=document.documentElement.dataset.theme!=="dark";S.settings.theme=dark?"dark":"light";save();applyTheme();render();};
  document.querySelectorAll("[data-seg]").forEach(function(sg){sg.querySelectorAll("button").forEach(function(b){b.onclick=function(){S.settings.units=b.dataset.v;save();render();};});});}
}
function setLang(l){LANG=l;S.settings.lang=l;save();document.documentElement.lang=l;renderNav();render();}
document.querySelectorAll("#langSel button").forEach(function(b){b.onclick=function(){setLang(b.dataset.lang);};});
$("#themeBtn").addEventListener("click",function(){var dark=document.documentElement.dataset.theme!=="dark";S.settings.theme=dark?"dark":"light";save();applyTheme();render();});
$("#avatarBtn").addEventListener("click",function(){go("settings");});
$("#globalSearch").addEventListener("keydown",function(e){if(e.key==="Enter"){exQuery=e.target.value;exFilter="all";go("exercises");}});
$("#bellBtn").addEventListener("click",function(){openSheet('<div class="row-between" style="margin-bottom:12px"><h2>'+t("notifTitle")+'</h2><button class="del-btn" onclick="closeSheet()">'+ic("x",18)+'</button></div>'+notifications().map(function(n){return '<div class="list-row"><span class="icon-tile" style="background:var(--amber-soft);color:var(--amber);width:38px;height:38px;flex-basis:38px">'+ic("bell",17)+'</span><span style="font-weight:600">'+esc(n)+'</span></div>';}).join("")+'<button class="btn ghost" style="width:100%;margin-top:14px" onclick="closeSheet()">'+t("close")+'</button>');});
function addWater(ml){S.water[todayKey()]=(S.water[todayKey()]||0)+ml;save();if(VIEW==="water"||VIEW==="dashboard")render();renderNav();toast(t("waterAdded")+" +"+ml+"ml","ok");}
function quickWater(){addWater(250);}
function undoWater(){S.water[todayKey()]=Math.max(0,(S.water[todayKey()]||0)-250);save();render();renderNav();}
function saveWaterGoal(){var v=parseInt($("#wGoal").value,10);if(isNaN(v)||v<500){toast(t("invalidNum"),"bad");return;}S.settings.waterGoal=v;save();toast(t("savedOk"),"ok");render();renderNav();}
function quickFood(i){var f=FOODS[i];if(!S.food[todayKey()])S.food[todayKey()]=[];S.food[todayKey()].push({name:L(f.name),kcal:f.kcal,p:f.p,c:f.c,f:f.f});save();toast(t("foodAdded"),"ok");render();}
function delFood(i){confirmDlg(t("confirmDelete"),function(){dayFood().splice(i,1);save();toast(t("deletedOk"),"ok");render();});}
function openWeightForm(){openSheet('<div class="row-between" style="margin-bottom:14px"><h2>'+t("addWeight")+'</h2><button class="del-btn" onclick="closeSheet()">'+ic("x",18)+'</button></div>'
 +'<div class="field"><label>'+t("weightKg")+' ('+(S.settings.units==="imperial"?t("lb"):t("kg"))+')</label><input id="wVal" type="number" step="0.1" min="20" max="400" placeholder="65.0"></div>'
 +'<div class="field"><label>'+t("date")+'</label><input id="wDate" type="date" value="'+todayKey()+'" max="'+todayKey()+'"></div>'
 +'<button class="btn" style="width:100%" onclick="submitWeight()">'+ic("check",17)+' '+t("save")+'</button>');setTimeout(function(){var i=$("#wVal");if(i)i.focus();},60);}
function submitWeight(){var v=parseFloat($("#wVal").value),d=$("#wDate").value||todayKey();
 if(isNaN(v)||v<20||v>600){toast(t("invalidNum"),"bad");return;}
 var kg=S.settings.units==="imperial"?+(v/2.20462).toFixed(1):v;
 S.weights=S.weights.filter(function(x){return x.date!==d;});S.weights.push({date:d,kg:kg});save();closeSheet();toast(t("weightAdded"),"ok");renderNav();if(VIEW==="progress"||VIEW==="dashboard")render();else render();}
function delWeight(d,kg){confirmDlg(t("confirmDelete"),function(){S.weights=S.weights.filter(function(x){return !(x.date===d&&x.kg===kg);});save();toast(t("deletedOk"),"ok");render();});}
function openExercise(id){var e=exById(id),cs=CAT_STYLE[e.cat];
 openSheet('<div class="ex-art" style="background:'+cs[0]+';color:'+cs[1]+';height:120px">'+ic(cs[2],54)+'<span class="tag diff" style="background:var(--surface);color:var(--ink2)">'+t(e.diff)+'</span></div>'
 +'<h2 style="font-size:20px">'+esc(L(e.name))+'</h2><p class="sub" style="margin:2px 0 12px">'+esc(L(e.muscle))+'</p>'
 +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px"><span class="tag s">'+t("category")+': '+t(e.cat)+'</span><span class="tag s">'+t("equipment")+': '+t(e.eq)+'</span><span class="tag g">'+t("recommended")+': '+e.sets+' '+t("sets")+' × '+esc(e.reps)+'</span></div>'
 +'<h3 style="margin-bottom:8px">'+t("instructions")+'</h3><ol style="margin:0 0 20px;padding-left:20px;display:flex;flex-direction:column;gap:7px">'+L(e.steps).map(function(s){return '<li>'+esc(s)+'</li>';}).join("")+'</ol>'
 +'<div style="display:flex;gap:10px"><button class="btn" style="flex:1" onclick="closeSheet();go(\'workouts\');setTimeout(function(){openRoutineForm(\''+e.id+'\')},60)">'+ic("plus",16)+' '+t("createRoutine")+'</button><button class="btn ghost" onclick="closeSheet()">'+t("close")+'</button></div>');}
var formItems=[];
function openRoutineForm(preselect){formItems=preselect?[{ex:preselect,sets:3,reps:"12",rest:60}]:[];
 openSheet('<div class="row-between" style="margin-bottom:14px"><h2>'+t("createRoutine")+'</h2><button class="del-btn" onclick="closeSheet()">'+ic("x",18)+'</button></div>'
 +'<div class="field"><label>'+t("routineName")+'</label><input id="rName" placeholder="'+t("routineNamePh")+'"><span class="err">'+t("nameRequired")+'</span></div>'
 +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label>'+t("category")+'</label><select id="rCat">'+CATS.map(function(c){return '<option value="'+c+'">'+t(c)+'</option>';}).join("")+'</select></div>'
 +'<div class="field"><label>'+t("duration")+'</label><input id="rDur" type="number" min="5" max="300" value="30"></div></div>'
 +'<h3 style="margin-bottom:8px">'+t("pickExercises")+'</h3><div id="rItems" style="display:flex;flex-direction:column;gap:7px;margin-bottom:12px"></div>'
 +'<div style="display:flex;gap:8px"><select id="rExPick" style="flex:1;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface)">'+EX.map(function(e){return '<option value="'+e.id+'">'+esc(e.name.en)+' · '+t(e.cat)+'</option>';}).join("")+'</select><button class="btn soft" onclick="addFormItem()">'+ic("plus",16)+'</button></div>'
 +'<p class="err" id="rExErr" style="color:var(--red);font-size:12.5px;font-weight:600;display:none;margin:10px 0 0">'+t("pickOneEx")+'</p>'
 +'<button class="btn" style="width:100%;margin-top:18px" onclick="submitRoutine()">'+ic("check",17)+' '+t("save")+'</button>');
 drawFormItems();}
function drawFormItems(){var box=$("#rItems");if(!box)return;
 box.innerHTML=formItems.map(function(it,i){var e=exById(it.ex);return '<div class="routine-ex"><span style="flex:1">'+esc(L(e.name))+'</span><input type="number" min="1" max="20" value="'+it.sets+'" title="'+t("sets")+'" style="width:52px;border:1px solid var(--line);border-radius:7px;padding:3px 6px;background:var(--surface)" onchange="formItems['+i+'].sets=+this.value"><span class="sub">'+t("sets")+'</span><input type="text" value="'+esc(it.reps)+'" title="'+t("reps")+'" style="width:56px;border:1px solid var(--line);border-radius:7px;padding:3px 6px;background:var(--surface)" onchange="formItems['+i+'].reps=this.value"><span class="sub">'+t("reps")+'</span><button class="del-btn" style="width:32px;height:32px;flex-basis:32px" onclick="formItems.splice('+i+',1);drawFormItems()">'+ic("trash",15)+'</button></div>';}).join("")||'<p class="sub" style="margin:0">'+t("pickOneEx")+'</p>';}
function addFormItem(){var id=$("#rExPick").value,e=exById(id);formItems.push({ex:id,sets:e.sets,reps:String(e.reps),rest:60});drawFormItems();}
function submitRoutine(){var name=$("#rName").value.trim();
 if(!name){$("#rName").closest(".field").classList.add("invalid");return;}
 if(!formItems.length){$("#rExErr").style.display="block";return;}
 var dur=parseInt($("#rDur").value,10)||30;
 S.routines.push({id:"r"+Date.now(),name:name,cat:$("#rCat").value,duration:dur,items:formItems.slice()});
 save();closeSheet();toast(t("routineCreated"),"ok");render();}
function delRoutine(id){confirmDlg(t("confirmDelete"),function(){S.routines=S.routines.filter(function(r){return r.id!==id;});if(session&&session.routineId===id)session=null;save();toast(t("deletedOk"),"ok");render();});}
function startSession(id){session={id:id,routineId:id,done:{}};if(VIEW!=="workouts")go("workouts");else render();window.scrollTo({top:0,behavior:"smooth"});}
function toggleSet(i){if(session)session.done[i]=!session.done[i];render();}
function cancelSession(){session=null;render();}
function completeSession(){if(!session)return;var r=S.routines.find(function(x){return x.id===session.routineId;});if(!r){session=null;render();return;}
 S.history.push({id:"h"+Date.now(),routineId:r.id,name:r.name,date:todayKey(),duration:r.duration});session=null;save();toast(t("doneOk"),"ok");renderNav();render();}
function delHistory(id){confirmDlg(t("confirmDelete"),function(){S.history=S.history.filter(function(x){return x.id!==id;});save();toast(t("deletedOk"),"ok");render();});}
function resetAll(){confirmDlg(t("resetConfirm"),function(){S=defaultState();LANG="en";save();applyTheme();renderNav();render();toast(t("resetOk"),"ok");});}
function saveDashName(){var v=$("#dashName").value.trim();if(!v){toast(t("nameRequired"),"bad");return;}S.profile.name=v;save();toast(t("savedOk"),"ok");renderNav();render();}
/* ================= Init ================= */
document.documentElement.lang=LANG;
applyTheme();
renderNav();
render();

</script>
</script>
