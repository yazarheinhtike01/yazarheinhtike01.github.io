let favs = new Set(JSON.parse(localStorage.getItem('jlg_favs')||'[]'));
const view = document.getElementById('view');
const backBtn = document.getElementById('backBtn');
const hTitle = document.getElementById('hTitle');

function saveFavs(){ localStorage.setItem('jlg_favs', JSON.stringify([...favs])); }
function favKey(sid, jp){ return sid+'|'+jp; }

function phraseHTML(s, p){
  const on = favs.has(favKey(s.id, p[0])) ? ' on' : '';
  return `<div class="ph"><div class="body">
    <div class="jpT">${p[0]}</div>
    <div class="rd">${p[1]}</div>
    <div class="myT">${p[2]}</div>
  </div><button class="fav${on}" onclick="toggleFav('${s.id}','${p[0].replace(/'/g,"\\'")}',this)">★</button></div>`;
}

function toggleFav(sid, jp, el){
  const k = favKey(sid, jp);
  if (favs.has(k)) { favs.delete(k); el.classList.remove('on'); }
  else { favs.add(k); el.classList.add('on'); }
  saveFavs();
}

function goHome(){
  backBtn.style.display = 'none';
  hTitle.textContent = 'ဂျပန်ဘဝ လမ်းညွှန်';
  view.innerHTML =
    (favs.size ? `<div class="menuItem" onclick="showFavs()"><div class="ic">⭐</div><div><div class="t1">သိမ်းထားတာများ</div><div class="t2">お気に入り</div></div><div class="cnt">${favs.size} ခု</div></div>` : '')
    + SECTIONS.map(s => `<div class="menuItem" onclick="showSection('${s.id}')">
        <div class="ic">${s.icon}</div>
        <div><div class="t1">${s.title}</div><div class="t2">${s.jp} — ${s.desc}</div></div>
        <div class="cnt">စကားလုံး ${s.phrases.length}</div>
      </div>`).join('');
  window.scrollTo(0,0);
}

function showSection(id){
  const s = SECTIONS.find(x => x.id === id);
  backBtn.style.display = 'block';
  hTitle.textContent = s.title;
  view.innerHTML = `
    <div class="secTitle">${s.icon} ${s.title}</div>
    <div class="secJp">${s.jp}</div>
    <div class="steps"><h3>📌 သိထားသင့်တာများ</h3><ul>${s.steps.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="grp">🗣️ အသုံးဝင် စကားလုံးများ</div>
    ${s.phrases.map(p => phraseHTML(s, p)).join('')}`;
  window.scrollTo(0,0);
}

function showFavs(){
  backBtn.style.display = 'block';
  hTitle.textContent = 'သိမ်းထားတာများ';
  let html = `<div class="secTitle">⭐ သိမ်းထားတာများ</div><div class="secJp">お気に入り</div>`;
  let any = false;
  SECTIONS.forEach(s => s.phrases.forEach(p => {
    if (favs.has(favKey(s.id, p[0]))) { html += phraseHTML(s, p); any = true; }
  }));
  view.innerHTML = any ? html : `<div class="empty">သိမ်းထားတာ မရှိသေးပါ — စကားလုံးဘေးက ★ ကို နှိပ်ပြီး သိမ်းနိုင်ပါတယ်</div>`;
  window.scrollTo(0,0);
}

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { goHome(); return; }
  backBtn.style.display = 'block';
  hTitle.textContent = 'ရှာဖွေမှု';
  let html = `<div class="secTitle">🔍 「${e.target.value.trim()}」</div>`, any = false;
  SECTIONS.forEach(s => s.phrases.forEach(p => {
    if (p.some(x => x.toLowerCase().includes(q))) { html += `<div class="grp">${s.icon} ${s.title}</div>` + phraseHTML(s, p); any = true; }
  }));
  view.innerHTML = any ? html : `<div class="empty">မတွေ့ပါ — တခြား စာလုံးနဲ့ ရှာကြည့်ပါ</div>`;
});

goHome();
</script>
